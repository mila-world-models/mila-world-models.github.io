- date: "Thursday, October 29, 2026 · 3:00 pm ET"
  presenter: "David Klindt"
  presenterURL: "https://facultyprofiles.cshl.edu/david.klindt"
  paper: "When Does LeJEPA Learn a World Model?"
  abstract: >-
    A representation that scrambles the true degrees of freedom of the world cannot support reliable planning or compositional generalization. We prove that LeJEPA (alignment plus Gaussian regularization) linearly recovers the world’s latent variables from nonlinear observations, a property known as linear identifiability, in a broad class of worlds where latents evolve under stationary, additive-noise transitions. Our main result is that among all such worlds, the Gaussian is the unique latent distribution for which this guarantee holds. The forward direction rests on a spectral decomposition in which each degree of nonlinearity is strictly penalized by alignment, making the linear map the optimum; the converse rules out every non-Gaussian alternative. We further prove an approximate identifiability result where the guarantee degrades gracefully, and show that linear, orthogonal identifiability enables optimal latent-space planning. We validate the theory with experiments ranging from 2D examples to 1024-dimensional latents, including distributional ablations and pixel-based robotic control. Our theory turns an empirically successful recipe into a mathematical guarantee, providing the foundation for building World Models that provably recover the structure of the world.
  bio: >-
    David Klindt is an Assistant Professor at Cold Spring Harbor Laboratory whose lab studies intelligence in brains and machines. A central idea in his work is treating artificial neural networks as a new model organism: systems that can be probed, perturbed, and fully instrumented in ways biological brains don't allow, to develop and test theories of representation and learning that transfer back to neuroscience. His research spans four connected threads: identifiability theory (when learned representations reflect real, recoverable structure rather than arbitrary training artifacts), world models (how systems build internal models of their environment), mechanistic interpretability (understanding what is actually encoded inside trained networks), and computational neuroscience (particularly how the visual cortex represents and processes sensory information).
  status: "Past"
  links:
    video: "https://www.youtube.com/watch?v=guPwO_iap_s"

- date: "Thursday, October 15, 2026 · 3:00 pm ET"
  presenter: "Nicklas Hansen"
  presenterURL: "https://www.nicklashansen.com/"
  paper: "Hallucination in World Models is Predictable and Preventable"
  abstract: >-
    Generative world models now render strikingly realistic, action-controllable futures, yet they frequently hallucinate: rollouts remain visually fluent while drifting from the true dynamics. This raises two questions: can we tell when a world model is hallucinating, and what can we do about it? In this talk, I will address both, and argue that hallucination is, first and foremost, a data coverage problem. I will first introduce MMBench2, a 427-hour, 210-task dataset for visual world modeling with ground-truth actions, rewards, and live simulators, along with a 350M-parameter world model trained on this dataset. Using this testbed, I will show that hallucination is systematic, that each type of hallucination ties to specific model components, and that simple uncertainty metrics computed from the model’s own predictions reveal where it will fail at runtime. I will then show that the same metrics can be used for mitigation: coverage-aware sampling during training, and curiosity-driven data collection. I will conclude with open questions, including how these findings carry over to real-world data.
  bio: >-
    Nicklas Hansen is a postdoctoral researcher at NYU Courant working with Lerrel Pinto and Yann LeCun. Nick's research focuses on developing generalist AI agents that learn from interaction. They recently completed their PhD at UC San Diego advised by Xiaolong Wang and Hao Su, and have also spent time at NVIDIA Research, Meta AI (FAIR), and UC Berkeley.
  status: "Past"
  links:
    video: "https://youtu.be/YQoaZRLXZuY"

- date: "Thursday, October 1, 2026 · 3:00 pm ET"
  presenter: "Michael Rabbat"
  presenterURL: "https://scholar.google.com/citations?user=cMPKe9UAAAAJ"
  paper: "Towards World Models via Joint-Embedding Predictive Architectures"
  abstract: >-
    This talk provides an overview and motivation for why world models are a necessary component of future AI systems. The term “world model” is overloaded in the broader discourse. For the purposes of this talk I’ll argue that a world model should: (a) construct an agent’s internal representation of the world through perception, and (b) should be able to predict the evolution of this representation through time, including in response to the agent’s actions. Such a world model enables planning. Two main research questions are then: *how to learn such a world model from data?* and *how to use it for planning and control?* I’ll give an overview of our work on Joint-Embedding Predictive Architectures (JEPAs) and will discuss interesting directions for future work.
  bio: >-
    Michael Rabbat is Co-founder and VP World Models at Advanced Machine Intelligence (AMI Labs), where he is building a new breed of AI systems focused on understanding and reasoning about the world. He is also an Associate Industry Member at Mila. Previously, Michael was a Research Director at Meta, where he was a founding member of FAIR Montréal, contributing to the company’s fundamental AI research efforts. Prior to that, he spent over a decade as a professor at McGill University in Electrical and Computer Engineering. He earned his PhD from the University of Wisconsin, Madison. Throughout his career he has worked on a variety of topics across signal processing, learning, and optimization, including distributed optimization and federated learning. His current research is focused on methods for training world models and using them for planning and control.
