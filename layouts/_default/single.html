{{ define "main" }}
  <article class="prose">
    <h1>{{ .Title }}</h1>
    {{ .Content }}

    {{ if .Params.form }}
      {{ partial "contact-form.html" . }}
    {{ end }}
  </article>

  {{ if .Params.gallery }}
    {{ partial "gallery.html" . }}
  {{ end }}

  <p class="back"><a href="{{ site.Home.RelPermalink }}">&larr; Back to the reading group</a></p>
{{ end }}
