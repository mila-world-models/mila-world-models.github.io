# The deploy workflow passes the real URL at build time, so "/" is fine here
# and keeps `hugo server` clean. Change it if you build by hand.
baseURL = "/"
title = "World Models Reading Group"

# One page — no tags/categories pages needed.
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  # Shown in the header and footer
  author = "World Models Reading Group"
  short = "World Models RG"
  description = "The World Models Reading Group meets biweekly at Mila to discuss recent work on world models."
  footer = "World Models Reading Group"

  # Practical details shown under the intro. Leave any of these blank ("") to hide.
  when = "Thursday, 3:00–4:00 pm (ET)"
  where = 'Mila, Auditorium 2 — and on <a href="https://mcgill.zoom.us/j/88388571288?pwd=Enyi4Plc3MXm5PNCT5wXGfxHdx9ekR.1">Zoom</a>'
  # Heading for the schedule section. "Schedule", "Talks", "Past sessions"...
  sessionsHeading = "Schedule"

  # Where the "Contact" link goes. Leave "" to use the built-in /contact/ page.
  # Set it to send people somewhere else entirely — a Google Form, a Slack
  # invite, or another organizer's page — and nothing links to /contact/ any more.
  # (Delete content/contact.md too if you want that page gone for good.)
  contactURL = ""

  # Public Google Group people join to get talk announcements. Leave "" to hide
  # the "Join the mailing list" button.
  mailingListURL = "https://groups.google.com/g/mila-world-models-rg"
  # Same group, for people without a Google account: emailing the +subscribe
  # address joins them. Leave "" to hide the email option.
  mailingListSubscribe = "mila-world-models-rg+subscribe@googlegroups.com"
  # Slack channel for people at Mila. slackURL is optional: paste the channel
  # link (right-click the channel in Slack → Copy link) to make it clickable.
  slackChannel = "#world-models"
  slackURL = "https://mila-umontreal.slack.com/archives/C0AF2KA3SQY"

  # Where the contact form posts: a FormSubmit endpoint that forwards messages to
  # the private organizers' group (world-models-rg@mila.quebec, which must accept
  # posts from outside senders). The random string hides the address. Not the
  # public mailing list above: anything sent there goes to every subscriber.
  formEndpoint = "https://formsubmit.co/0b1cb7dbcd9dd36c310ba575c0306c1a"


[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[params.date]
  format = "Jan 2, 2006"
